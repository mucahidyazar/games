<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script src="/theme-init.js"></script>
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="%SITE_THEME_COLOR%" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="%SITE_FAVICON%" />
    <link rel="icon" type="image/png" sizes="192x192" href="%SITE_ICON%" />
    <link rel="apple-touch-icon" href="%SITE_APPLE_ICON%" />
    <meta name="apple-mobile-web-app-title" content="%SITE_NAME%" />
    <link rel="manifest" href="%SITE_MANIFEST%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="%SITE_OG_TITLE%" />
    <meta property="og:description" content="%SITE_OG_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_OG_IMAGE%" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%SITE_OG_ALT%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_OG_TITLE%" />
    <meta name="twitter:description" content="%SITE_OG_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_OG_IMAGE%" />
    <meta name="twitter:image:alt" content="%SITE_OG_ALT%" />
    <script type="application/ld+json">%SITE_JSON_LD%</script>
  </head>
  <body>
    <noscript><p style="padding: 24px; text-align: center">%SITE_NOSCRIPT%</p></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
