<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script src="/theme-init.js"></script>
    <!-- The page's title, description, canonical URL and link preview: vite-plugins/seoFiles.ts writes them for each page. -->
    %PAGE_HEAD%
    <meta name="theme-color" content="%SITE_THEME_COLOR%" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="%SITE_FAVICON%" />
    <link rel="icon" type="image/png" sizes="192x192" href="%SITE_ICON%" />
    <link rel="apple-touch-icon" href="%SITE_APPLE_ICON%" />
    <meta name="apple-mobile-web-app-title" content="%SITE_NAME%" />
    <link rel="manifest" href="%SITE_MANIFEST%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript><p style="padding: 24px; text-align: center">%SITE_NOSCRIPT%</p></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
